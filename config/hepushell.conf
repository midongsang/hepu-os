// HepuShell 默认配置文件
// 简化版QML语法，定义桌面界面

// 全局主题配置
Theme {
    name: "default"
    background: #1A1B26
    panel_bg: #16161E
    panel_fg: #A9B1D3
    border: #3B4261
    accent: #7AA2F7
    window_bg: #24283B
    window_fg: #C0CAF5
    titlebar_bg: #1F2335
}

// 顶部面板
Panel {
    position: top
    height: 28
    background: #16161E

    Widget {
        type: workspaces
        align: left
    }

    Widget {
        type: cpu
        align: left
    }

    Widget {
        type: memory
        align: left
    }

    Widget {
        type: clock
        align: right
    }
}

// 底部面板
Panel {
    position: bottom
    height: 28
    background: #16161E

    Widget {
        type: tasks
        align: left
    }

    Widget {
        type: systray
        align: right
    }
}

// 启动器配置
Launcher {
    width: 400
    height: 300
    background: #24283B
    border: #7AA2F7
    input_bg: #1F2335
}

// 窗口管理器配置
WindowManager {
    layout: tile
    gap: 4
    border_width: 1
    focus_border: #7AA2F7
    normal_border: #3B4261
}

// 工作区配置
Workspaces {
    count: 9
    names: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
}
