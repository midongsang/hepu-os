name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential gcc make binutils nasm \
            e2fsprogs qemu-system-x86 qemu-utils \
            python3 python3-pip python3-xattr mtools unzip

      - name: Build bootloader (stage2)
        run: make -C tools/hepboot/x86_64

      - name: Build gnu-efi (UEFI library)
        run: make -C tools/gnu-efi

      - name: Build bootloader (UEFI)
        run: |
          make -C tools/hepboot/uefi || {
            echo "=== UEFI build diagnostics ==="
            ls -la tools/hepboot/uefi/hepboot_uefi.so 2>/dev/null
            sha1sum tools/hepboot/uefi/hepboot_uefi.so 2>/dev/null
            file tools/hepboot/uefi/hepboot_uefi.so 2>/dev/null
            echo "--- 前 64 字节 hexdump ---"
            head -c 64 tools/hepboot/uefi/hepboot_uefi.so | xxd 2>/dev/null
            echo "--- 工具链路径与版本 ---"
            which -a ld objcopy
            ld --version | head -1
            objcopy --version | head -1
            echo "--- ld 支持的模拟 ---"
            ld -V 2>&1 | head -8
            echo "--- objcopy efi target ---"
            objcopy --info 2>/dev/null | grep -i efi || echo "objcopy --info 列表无 efi (正常现象, 不一定不支持)"
            df -h /home/runner/work | tail -1
            exit 1
          }

      - name: Build 64-bit kernel
        run: make -C kernel/arch/x86_64 -j$(nproc)

      - name: Build user apps (ulib + static ELFs)
        run: make -C user -j$(nproc) || true

      - name: Package single-IMG (ext2 + MBR + kernels)
        run: bash tools/make_single_img64.sh
        env:
          LD_SRC_FALLBACK: 1

      - name: Package UEFI hybrid-IMG (GPT + FAT32 ESP)
        run: python3 tools/make_uefi_img.py

      - name: Image info
        run: |
          stat -c '%n: %s bytes' /tmp/hepu64_single.img /tmp/hepu64_uefi.img

      - name: Attach image to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/hepu64_single.img
            /tmp/hepu64_uefi.img
          body: |
            **镜像自动构建产物** · tag `${{ github.ref_name }}`
            - 架构: x86_64 内核 + 32-bit legacy fallback
            - 分区: MBR + ext2 根分区 (224MB)
            - 镜像: `hepu64_single.img` = Legacy BIOS; `hepu64_uefi.img` = BIOS + UEFI (GPT/ESP)
            - 写入 U 盘请用 Rufus 的 DD 模式; UEFI 机器需关闭 Secure Boot

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            /tmp/hepu64_single.img
            /tmp/hepu64_uefi.img
          retention-days: 7
