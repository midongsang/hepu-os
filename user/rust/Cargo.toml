[workspace]
members = [
    "fs-client",
    "file-server",
    "file-server-e2e-test",
    "sysinfo",
    "echo",
    "hepu-sys",
    "hello-rust",
    "cat",
    "ipc-e2e-test",
    "fork-test",
    "socket-test",
    "app-store",
    "net-server",
    "process-monitor",
    "log-service",
]
resolver = "2"

[profile.dev]
opt-level = "z"
lto = false
panic = "abort"
codegen-units = 1

[profile.release]
opt-level = "z"
lto = false
panic = "abort"
codegen-units = 1
